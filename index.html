<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Таро</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <div id="app"></div>

    <script>
    
        function showHome() {
    
            document.getElementById("app").innerHTML = `
        
        <h1>🍀 МНЕ ПОВЕЗЁТ</h1>

        <p>✨ Добро пожаловать во Вселенную, где всё может сложиться хорошо.</p>

        <p><b>Что хочешь получить сегодня?</b></p>

        <button onclick="showUniverse()">🐾 Вселенная мурчит тебе</button>

        <button onclick="showTarot()">🔮 Замурчательное Таро</button>
    `;
}

showHome();
        
        function showUniverse() {
    document.getElementById("app").innerHTML = `
        <h2>🐾 Вселенная мурчит тебе...</h2>

        <p>✨ Всё складывается в твою пользу.</p>

        <button onclick="goHome()">🍀 В начало</button>
    `;
}

function showTarot() {
    document.getElementById("app").innerHTML = `
        <h2>🔮 Замурчательное Таро</h2>

        <p>Загадай мысленно свой вопрос ✨</p>

        <p><b>Выбери, что тебя интересует:</b></p>

        <button onclick="getCard('advice')">🌟 Совет дня</button>
        <button onclick="getCard('day')">☀️ Карта дня</button>
        <button onclick="getCard('yes_no')">❓ Да / Нет</button>
        <button onclick="getCard('love')">❤️ Любовь и отношения</button>
        <button onclick="getCard('money')">💰 Финансы</button>
        <button onclick="getCard('career')">💼 Работа и карьера</button>
        <button onclick="getCard('family')">🏠 Дом и семья</button>

        <br><br>

        <button onclick="goHome()">🍀 В начало</button>
    `;
}

function goHome() {
    location.reload();
}

async function getCard(theme) {

            // Загружаем нашу колоду
            const response = await fetch("cards.json");

            const cards = await response.json();

            // Выбираем случайную карту
            const card = cards[Math.floor(Math.random() * cards.length)];

            // Получаем нужное толкование
            const interpretation = card[theme] || "Пока нет толкования.";

            // Показываем результат
document.getElementById("app").innerHTML = `
    <h2>✨ ${card.name}</h2>

    <img src="${card.image}" width="300">

    <p>${interpretation}</p>
     <br>

    <button onclick="goHome()">🍀 В начало</button>
`;
        }

    </script>

</body>
</html>
