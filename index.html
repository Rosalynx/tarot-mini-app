<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Вселенная мурчит</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {
            margin: 0;
            padding: 0;

            background: #17152b;

            color: #f7f2ff;

            font-family: Arial, sans-serif;

            text-align: center;
        }


        /* ===== ПОСТОЯННАЯ ШАПКА ===== */

        #header {

            width: 100%;

            padding: 18px 0 10px 0;

            box-sizing: border-box;
        }


        /* МЕСТО ДЛЯ БУДУЩЕЙ КАРТИНКИ */

        #header-image {

            width: 90%;

            max-width: 500px;

            margin: 0 auto;

            display: block;

            border-radius: 20px;
        }


        /* ПОКА КАРТИНКИ НЕТ */

        #header-placeholder {

            font-size: 25px;

            font-weight: bold;

            letter-spacing: 2px;

            padding: 15px;

            color: #f4d98b;
        }


        /* ===== ОСНОВНОЕ СОДЕРЖИМОЕ ===== */

        #app {

            padding: 10px 20px 30px 20px;

            max-width: 600px;

            margin: auto;
        }


        h1 {

            font-size: 32px;

            margin-bottom: 15px;
        }


        h2 {

            font-size: 25px;

            margin-bottom: 20px;
        }


        p {

            font-size: 18px;

            line-height: 1.5;
        }


        /* ===== КНОПКИ ===== */

        button {

            display: block;

            width: 100%;

            max-width: 500px;

            margin: 12px auto;

            padding: 16px;

            border: none;

            border-radius: 16px;

            background: #6d5aa8;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }


        button:active {

            transform: scale(0.98);
        }


        /* ===== КАРТА ===== */

        .card-image {

            width: 100%;

            max-width: 330px;

            border-radius: 18px;

            margin: 10px auto 20px auto;

            display: block;
        }


        .interpretation {

            font-size: 18px;

            line-height: 1.6;

            margin: 15px auto;

            max-width: 500px;
        }

    </style>

</head>


<body>


    <!-- ================================= -->
    <!-- ПОСТОЯННАЯ ШАПКА ВСЕЛЕННОЙ МУРЧИТ -->
    <!-- ================================= -->

    <div id="header">

        <!--

        СЮДА ПОТОМ ПОСТАВИМ КАРТИНКУ

        Например:

        <img
            id="header-image"
            src="header.png"
            alt="Вселенная мурчит"
        >

        -->

        <div id="header-placeholder">

            🐾 ВСЕЛЕННАЯ МУРЧИТ 🐾

        </div>

    </div>



    <!-- ================================= -->
    <!-- ЗДЕСЬ МЕНЯЮТСЯ ЭКРАНЫ -->
    <!-- ================================= -->

    <div id="app"></div>



    <script>


        /* =================================
           ЭКРАН 1 — ГЛАВНАЯ
        ================================= */

        function showHome() {

            document.getElementById("app").innerHTML = `

                <h1>🍀 МНЕ ПОВЕЗЁТ</h1>

                <p>
                    ✨ Добро пожаловать во Вселенную,
                    где всё может сложиться хорошо.
                </p>

                <p>
                    <b>Что хочешь получить сегодня?</b>
                </p>


                <button onclick="showUniverse()">

                    🐾 Вселенная мурчит тебе

                </button>


                <button onclick="showTarot()">

                    🔮 Замурчательное Таро

                </button>

            `;
        }



        /* =================================
           ЭКРАН 2А — ВСЕЛЕННАЯ МУРЧИТ
        ================================= */

        async function showUniverse() {

    const response = await fetch("messages.json");

    const messages = await response.json();

    const message =
        messages[
            Math.floor(
                Math.random() * messages.length
            )
        ];


    document.getElementById("app").innerHTML = `

        <h2>
            🐾 Вселенная мурчит тебе...
        </h2>


        <p class="interpretation">

            ${message}

        </p>


        <button onclick="goHome()">

            🍀 В начало

        </button>

    `;
}


        /* =================================
           ЭКРАН 2Б — ТАРО
        ================================= */

        function showTarot() {

            document.getElementById("app").innerHTML = `

                <h2>
                    🔮 Замурчательное Таро
                </h2>


                <p>
                    Загадай мысленно свой вопрос ✨
                </p>


                <p>
                    <b>
                        Выбери, что тебя интересует:
                    </b>
                </p>


                <button onclick="getCard('advice')">

                    🌟 Совет дня

                </button>


                <button onclick="getCard('day')">

                    ☀️ Карта дня

                </button>


                <button onclick="getCard('yes_no')">

                    ❓ Да / Нет

                </button>


                <button onclick="getCard('love')">

                    ❤️ Любовь и отношения

                </button>


                <button onclick="getCard('money')">

                    💰 Финансы

                </button>


                <button onclick="getCard('career')">

                    💼 Работа и карьера

                </button>


                <button onclick="getCard('family')">

                    🏠 Дом и семья

                </button>


                <br>


                <button onclick="goHome()">

                    🍀 В начало

                </button>

            `;
        }



        /* =================================
           ЭКРАН 3 — КАРТА
        ================================= */

        async function getCard(theme) {


            const response = await fetch("cards.json");


            const cards = await response.json();


            const card =
                cards[
                    Math.floor(
                        Math.random() * cards.length
                    )
                ];


            const interpretation =
                card[theme]
                ||
                "Пока нет толкования.";


            document.getElementById("app").innerHTML = `

                <h2>
                    ✨ ${card.name}
                </h2>


                <img

                    class="card-image"

                    src="${card.image}"

                    alt="${card.name}"

                >


                <div class="interpretation">

                    ${interpretation}

                </div>


                <button onclick="goHome()">

                    🍀 В начало

                </button>

            `;
        }



        /* =================================
           НАЗАД НА ГЛАВНУЮ
        ================================= */

        function goHome() {

            showHome();

        }



        /* =================================
           ЗАПУСКАЕМ ПРИЛОЖЕНИЕ
        ================================= */

        showHome();


    </script>


</body>

</html>
