<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Таро</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <h1>🍀 МНЕ ПОВЕЗЁТ</h1>

    <p>✨ Добро пожаловать во Вселенную, где всё может сложиться хорошо.</p>

    <p><b>Что хочешь получить сегодня?</b></p>

    <button onclick="showUniverse()">🐾 Вселенная мурчит тебе</button>

    <button onclick="showTarot()">🔮 Замурчательное Таро</button>

    <div id="result"></div>


    <script>

        async function getCard(theme) {

            // Загружаем нашу колоду
            const response = await fetch("cards.json");

            const cards = await response.json();

            // Выбираем случайную карту
            const card = cards[Math.floor(Math.random() * cards.length)];

            // Получаем нужное толкование
            const interpretation = card[theme] || "Пока нет толкования.";

            // Показываем результат
            document.getElementById("result").innerHTML = `
    <h2>✨ ${card.name}</h2>

    <img src="${card.image}" width="300">

    <p><b>Тема:</b> ${theme}</p>

    <p>${interpretation}</p>
`;
        }

    </script>

</body>
</html>
